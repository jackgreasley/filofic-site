<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{%- for alternate in page.alternates %}
    <link rel="alternate" hreflang="{{ alternate.hreflang }}" href="{{ alternate.href | absolute_url }}">
{%- endfor %}
{%- if page.alternates %}
    <link rel="alternate" hreflang="x-default" href="{{ page.alternates.first.href | absolute_url }}">
{%- endif %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ "/" | relative_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
        <p>{{ site.description | default: site.github.project_tagline }}</p>
      </header>
      <section>
      {{ content }}
      </section>
    </div>
  </body>
</html>
